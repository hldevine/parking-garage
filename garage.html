<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================= Settings to change =================
const CONFIG = {
  exposureSeconds: 60,
  eyeHeight: 1.6,       // desktop preview only; the headset uses the person's real height
  ceiling: 2.8,         // metres
  garageLength: 60,     // along the aisle
  lighting: {
    high: { ambient: 0.95, lampIntensity: 10, fixturesOnShare: 1.0, fogFar: 90, flicker: false, targetBrightness: [1, 1, 1, 1, 1, 1] },
    low:  { ambient: 0.65, lampIntensity: 8,  fixturesOnShare: 0.25, fogFar: 32, flicker: false, targetBrightness: [0.559, 0.425, 0.177, 0.769, 0.262, 0.262] },
    // targetBrightness: how bright each search target T1-T6 is (1 = as drawn). Dimmed in low lighting so each target stands out
    // from its surroundings as much as in bright lighting (measured with garageCapture({ signStats: true })).
  },
  concealment: {
    low:  { occupancy: 0.5, tallShare: 0.0 },  // share of bays filled; share of vehicles that are vans/SUVs
    high: { occupancy: 0.5,  tallShare: 0.6 },
  },
  // ---- Two-level layout ----
  levels: {
    drop: 3.1,             // metres from one floor down to the next
    names: ['P2', 'P1'],   // stencilled level names, upper level first
    farExit: [false, true], // whether each level has the large exit ramp at the far end (upper level: none)
    carSeeds: [5, 354],    // each number fixes which bays are filled on that level (5 = the arrangement you had before).
                           // With occupancy 0.5 and tallShare 0.6, both give 20 vehicles per level, 14 of them vans in the threat version.
                           // If you change those two settings, the levels may stop matching: count the vehicles again, or try other numbers here.
  },
  // ---- Realism settings (the same in every condition) ----
    walk: { speed: 3.5, halfWidth: 3.0, endGap: 1.5 }, // walking speed in metres per second; how far from the centre line and from each end you can go
    look: { degreesPerPixel: 0.15, maxPitch: 85 },    // how far the view turns per pixel of mouse movement; how far you can look up or down (degrees)
    outside: { photo: 'textures/day_external_4096.jpg', brightness: 1, turn: 2 },   // 360-degree photo seen outside, in control only (see showOutside). A 3.7 MB web copy of day_external.jpg (Unity uses the full 8192 px); '' = the built-in night skyline
    fixtureGlow: 0.5,     // soft glow on the ceiling around each lit fixture (0 = off, 1 = strong)
    floorTexture: {       // leave the three paths empty to use the built-in generated concrete
    color: 'textures/concrete_floor_worn_001_diff_1k.jpg',
    normal: 'textures/concrete_floor_worn_001_nor_gl_1k.jpg',
    roughness: 'textures/concrete_floor_worn_001_rough_1k.jpg',
    tileMetres: 3,      // how many metres one copy of the photo covers
    brightness: 1.15,   // 1 = the photo as it is; higher = lighter floor, lower = darker
  },
};

// ================= Renderer and viewer =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
// ---- From the link: ?c=0 (control) or ?c=1 (threat), &pid=..., and ?debug=1 for the researcher panel and tools ----
const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const condCode = params.get('c');                                       // the code as given; checked at the end of the script
const pid = (params.get('pid') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);   // only safe characters, for the CSV
if (DEBUG) document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking', 'local-floor'] }));

const scene = new THREE.Scene();
const NIGHT = new THREE.Color(0x06080d);      // plain dark outside: what the threat condition shows
scene.background = NIGHT;
let outsidePhoto = null;
if (CONFIG.outside.photo) new THREE.TextureLoader().load(CONFIG.outside.photo, photo => {   // a 360-degree photo wrapped around the whole scene
  photo.mapping = THREE.EquirectangularReflectionMapping; photo.colorSpace = THREE.SRGBColorSpace;
  scene.backgroundIntensity = CONFIG.outside.brightness; scene.backgroundRotation.y = CONFIG.outside.turn;
  outsidePhoto = photo; showOutside();
}, undefined, () => console.warn('Could not load the outside photo: ' + CONFIG.outside.photo));
// The outside photo is shown only while the sides are open (entrapment low = control). With entrapment high (threat)
// the walls already block the view; the plain dark background also stops daylight leaking through hairline gaps between boxes.
function showOutside() { scene.background = cond.entrapment === 'low' && outsidePhoto ? outsidePhoto : NIGHT; }
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0, CONFIG.eyeHeight, 0);
camera.rotation.order = 'YXZ';                                          // turn left/right first, then up/down (see "Looking around")
const player = new THREE.Group(); player.position.set(0.8, 0, 0); scene.add(player); player.add(camera);

// ================= Materials =================
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.92, ...o });
const M = {
  floor: mat(0x5c5d5f), ceiling: mat(0x6b6c6e), wall: mat(0x78797b), pillar: mat(0x8a8b8d),
  paint: mat(0xd8d2b0), stripe: mat(0xd9b52c), gate: mat(0x4a4d52, { metalness: 0.5, roughness: 0.5 }),
  tubeOn: new THREE.MeshStandardMaterial({ color: 0xf4f8ff, emissive: 0xe8f0ff, emissiveIntensity: 1.6 }),
  tubeOff: mat(0x3a3b3d),
  exitOn: new THREE.MeshStandardMaterial({ color: 0x1f8f4a, emissive: 0x22c55e, emissiveIntensity: 1.4 }),
  exitOff: mat(0x1d2a22),
  dumpster: mat(0x2f4a36), glass: mat(0x1c2530, { roughness: 0.3, metalness: 0.2 }),
  door: mat(0x6a5a44),
};
const carColors = [0x8b1e1e, 0x1e3a5f, 0x2d2d2d, 0xb8b8b8, 0x3f5f3f, 0xe6e6e6, 0x5b4b3a];

// ================= Generated surfaces (drawn in code, so there is nothing to download) =================
// Each surface is a picture drawn once when the page loads, from fixed random seeds,
// so it comes out identical on every run and in every condition.
let texSeed = 1234;
const texRand = () => (texSeed = (texSeed * 16807) % 2147483647) / 2147483647;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy()); // keeps the floor sharp at shallow angles
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Smooth random values (0..1) that wrap at the edges, so a surface can repeat without visible seams.
function tileNoise(w, h, cellsX, cellsY) {
  const g = new Float32Array(cellsX * cellsY).map(texRand), out = new Float32Array(w * h), ease = t => t * t * (3 - 2 * t);
  for (let y = 0; y < h; y++) {
    const fy = y / h * cellsY, y0 = Math.floor(fy), ty = ease(fy - y0), y1 = (y0 + 1) % cellsY;
    for (let x = 0; x < w; x++) {
      const fx = x / w * cellsX, x0 = Math.floor(fx), tx = ease(fx - x0), x1 = (x0 + 1) % cellsX;
      const a = g[y0 * cellsX + x0], b = g[y0 * cellsX + x1], c = g[y1 * cellsX + x0], d = g[y1 * cellsX + x1];
      out[y * w + x] = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    }
  }
  return out;
}
// Concrete mottling: large blotches, medium patches and fine grain added together.
function concreteCanvas(w, h, cells, mid, contrast) {
  const f = new Float32Array(w * h), ratio = h / w;
  for (const [c, amount] of [[cells, 0.45], [cells * 4, 0.25], [cells * 16, 0.18], [cells * 64, 0.12]]) {
    const n = tileNoise(w, h, c, Math.max(1, Math.round(c * ratio)));
    for (let i = 0; i < f.length; i++) f[i] += n[i] * amount;
  }
  const cv = canvasOf(w, h), g = cv.getContext('2d', { willReadFrequently: true }), img = g.createImageData(w, h);
  for (let i = 0; i < f.length; i++) {
    const v = mid + (f[i] - 0.5) * contrast;
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v * 0.985; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv;
}
function blot(g, x, y, r, rgb, alpha) {           // a soft-edged stain
  const grad = g.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${rgb},${alpha})`); grad.addColorStop(0.6, `rgba(${rgb},${alpha * 0.5})`); grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function cracks(g, w, h, count, alpha) {
  g.strokeStyle = `rgba(22,22,24,${alpha})`; g.lineWidth = 1.2;
  for (let i = 0; i < count; i++) {
    let x = w * (0.1 + 0.8 * texRand()), y = h * (0.1 + 0.8 * texRand()), a = texRand() * Math.PI * 2;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0, steps = 20 + texRand() * 40; s < steps; s++) { a += (texRand() - 0.5) * 0.7; x += Math.cos(a) * 4; y += Math.sin(a) * 4; g.lineTo(x, y); }
    g.stroke();
  }
}
function joint(g, x, y, w, h) { g.fillStyle = 'rgba(24,24,26,0.5)'; g.fillRect(x, y, w, h); } // a groove between slabs or formwork panels
function asTexture(canvas, metresX, metresY, colour = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / metresX, 1 / metresY); t.anisotropy = maxAniso;
  if (colour) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Average brightness of a picture, used so that adding it to a surface doesn't make that surface darker overall.
function meanBrightness(canvas) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data; let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4 * 37) { sum += Math.pow(d[i + 1] / 255, 2.2); n++; }
  return sum / n;
}
function applySurface(material, texture) {
  material.map = texture; material.userData.worldUV = true;
  material.color.multiplyScalar(1 / meanBrightness(texture.image));
}

// Floor: one copy covers 8 m x 8 m. Slab joints every 4 m, stains, hairline cracks, grit.
const floorCanvas = concreteCanvas(1024, 1024, 4, 212, 170);
{
  const g = floorCanvas.getContext('2d');
  for (let i = 0; i < 26; i++) blot(g, texRand() * 1024, texRand() * 1024, 20 + texRand() * 80, '25,24,22', 0.06 + texRand() * 0.14);
  for (let i = 0; i < 8; i++) blot(g, texRand() * 1024, texRand() * 1024, 30 + texRand() * 70, '235,233,226', 0.08 + texRand() * 0.08);
  for (let i = 0; i < 2600; i++) { g.fillStyle = texRand() > 0.5 ? 'rgba(20,20,20,0.28)' : 'rgba(245,245,240,0.22)'; g.fillRect(texRand() * 1024, texRand() * 1024, 1 + texRand() * 1.5, 1 + texRand() * 1.5); }
  cracks(g, 1024, 1024, 6, 0.5);
  for (const p of [0, 512]) { joint(g, p - 1.5, 0, 3, 1024); joint(g, 0, p - 1.5, 1024, 3); }
  joint(g, 1022.5, 0, 1.5, 1024); joint(g, 0, 1022.5, 1024, 1.5);
}
applySurface(M.floor, asTexture(floorCanvas, 8, 8));
M.floor.roughnessMap = asTexture(concreteCanvas(512, 512, 3, 222, 150), 11, 11, false); // patches worn smoother catch the light
M.floor.roughness = 1;

// Walls, posts and divider panels: one copy covers 8 m wide x 4 m tall, with the floor at the bottom edge.
// Formwork panel joints, tie holes, grime along the base and streaks running down from the ceiling.
const wallCanvas = concreteCanvas(1024, 512, 4, 214, 150);
{
  const g = wallCanvas.getContext('2d'), px = 128, rowOf = y => 512 - y * px;  // 128 pixels per metre
  for (let i = 0; i < 12; i++) blot(g, texRand() * 1024, rowOf(texRand() * 2.8), 25 + texRand() * 70, '30,29,27', 0.05 + texRand() * 0.1);
  for (let i = 0; i < 46; i++) {                    // streaks from the ceiling line down
    const x = texRand() * 1024, wd = 3 + texRand() * 12, len = 40 + texRand() * 230, top = rowOf(2.8);
    const grad = g.createLinearGradient(0, top, 0, top + len), c = texRand() > 0.3 ? '28,27,24' : '236,234,226';
    grad.addColorStop(0, `rgba(${c},${0.1 + texRand() * 0.14})`); grad.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = grad; g.fillRect(x, top, wd, len);
  }
  const grime = g.createLinearGradient(0, rowOf(0.45), 0, rowOf(0));
  grime.addColorStop(0, 'rgba(30,28,24,0)'); grime.addColorStop(1, 'rgba(30,28,24,0.42)');
  g.fillStyle = grime; g.fillRect(0, rowOf(0.45), 1024, 0.45 * px);
  for (let x = 0; x < 1024; x += 256) joint(g, x - 1, 0, 2.5, 512);        // panel joints every 2 m
  joint(g, 1022.5, 0, 1.5, 512); joint(g, 0, rowOf(1.4), 1024, 2.5);
  for (let x = 0; x < 1024; x += 256) for (const dx of [0.4, 1.6]) for (const y of [0.5, 1.0, 1.9, 2.4]) { // tie holes
    g.fillStyle = 'rgba(25,25,26,0.6)'; g.beginPath(); g.arc(x + dx * px, rowOf(y), 3.2, 0, Math.PI * 2); g.fill();
  }
  cracks(g, 1024, 512, 4, 0.4);
}
const wallTexture = asTexture(wallCanvas, 8, 4);
applySurface(M.wall, wallTexture); applySurface(M.pillar, wallTexture);

// Ceiling slab: formwork sheet lines and a few water stains.
const ceilingCanvas = concreteCanvas(1024, 1024, 4, 216, 130);
{
  const g = ceilingCanvas.getContext('2d');
  for (let i = 0; i < 7; i++) { const x = texRand() * 1024, y = texRand() * 1024, r = 30 + texRand() * 60; blot(g, x, y, r, '70,58,40', 0.16); blot(g, x, y, r * 0.7, '225,222,214', 0.12); }
  for (let i = 0; i < 6; i++) joint(g, i * 1024 / 6 - 1, 0, 2, 1024);
  for (let i = 0; i < 3; i++) joint(g, 0, i * 1024 / 3 - 1, 1024, 2);
}
applySurface(M.ceiling, asTexture(ceilingCanvas, 8, 8));

// Painted lines: scuffed and chipped, not a flat colour.
const paintCanvas = concreteCanvas(256, 256, 6, 222, 210);
{
  const g = paintCanvas.getContext('2d');
  for (let i = 0; i < 500; i++) { g.fillStyle = 'rgba(60,60,60,0.35)'; g.fillRect(texRand() * 256, texRand() * 256, 1 + texRand() * 3, 1 + texRand() * 2); }
}
const paintTexture = asTexture(paintCanvas, 2, 2);
applySurface(M.paint, paintTexture); applySurface(M.stripe, paintTexture);

// Optional photo texture for the floor (see CONFIG.floorTexture). If a file can't be loaded, the generated concrete stays.
if (CONFIG.floorTexture.color) {
  const loader = new THREE.TextureLoader(), ft = CONFIG.floorTexture;
  const load = (path, colour, apply) => path && loader.load(path, t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / ft.tileMetres, 1 / ft.tileMetres); t.anisotropy = maxAniso;
    if (colour) t.colorSpace = THREE.SRGBColorSpace;
    apply(t); M.floor.needsUpdate = true;
  }, undefined, () => console.warn('Could not load floor texture: ' + path));
  load(ft.color, true, t => { M.floor.map = t; M.floor.color.setScalar(ft.brightness); });
  load(ft.normal, false, t => { M.floor.normalMap = t; });
  load(ft.roughness, false, t => { M.floor.roughnessMap = t; });
}

// Soft shapes used for shadows, stains and glows.
function softCanvas(w, h, draw) { const c = canvasOf(w, h); draw(c.getContext('2d')); return c; }
const blobTexture = new THREE.CanvasTexture(softCanvas(128, 128, g => {
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.35, 'rgba(255,255,255,0.5)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
}));
const stainTexture = new THREE.CanvasTexture(softCanvas(128, 128, g => {
  for (let i = 0; i < 7; i++) blot(g, 64 + (texRand() - 0.5) * 50, 64 + (texRand() - 0.5) * 50, 14 + texRand() * 26, '255,255,255', 0.55);
}));
const carShadowTexture = new THREE.CanvasTexture(softCanvas(128, 256, g => {
  g.fillStyle = 'rgba(255,255,255,0.13)';
  for (let i = 0; i < 16; i++) { g.beginPath(); g.roundRect(4 + i * 2.2, 4 + i * 2.2, 120 - i * 4.4, 248 - i * 4.4, 22); g.fill(); }
}));
const laneTexture = new THREE.CanvasTexture(softCanvas(64, 512, g => {
  const n = tileNoise(64, 512, 3, 24), img = g.createImageData(64, 512);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 64; x++) {
    const i = (y * 64 + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
    img.data[i + 3] = 255 * Math.pow(Math.sin(Math.PI * x / 63), 1.5) * (0.35 + 0.65 * n[y * 64 + x]);
  }
  g.putImageData(img, 0, 0);
}));
laneTexture.wrapT = THREE.RepeatWrapping;
// Dark marks that sit just above the floor. polygonOffset stops them flickering against the floor at a distance.
const onFloor = (map, opacity) => new THREE.MeshBasicMaterial({ map, color: 0x000000, transparent: true, opacity, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const carShadowMat = onFloor(carShadowTexture, 0.62), stainMat = onFloor(stainTexture, 0.5), laneMat = onFloor(laneTexture, 0.3);
const flatGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);   // a 1 m square lying on the floor, facing up
const glowGeo = new THREE.PlaneGeometry(1, 1).rotateX(Math.PI / 2);    // a 1 m square on the ceiling, facing down
const glowMat = new THREE.MeshBasicMaterial({ map: blobTexture, color: 0xdfe8ff, transparent: true, opacity: CONFIG.fixtureGlow, blending: THREE.AdditiveBlending, depthWrite: false });

// Lays a surface picture out in real-world metres, so concrete runs continuously from one box to the next.
function worldUV(geo, x, y, z) {
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {

    v.position.set(side * 6.1, 0, z); v.rotation.y = Math.PI / 2;
    dyn.add(v);
  }
    // ---- Bay dividers: concrete wall (high concealment) or open grate (low concealment) ----
  const panelStart = DIV.xNear + DIV.post / 2;          // panel begins at the back of the post
  const panelLen = DIV.xFar - panelStart;
  const panelX = panelStart + panelLen / 2;             // centre of the panel
  if (cond.concealment === 'high') {
    for (const side of [-1, 1]) for (const z of dividerZ) box(panelLen, H, DIV.thick, M.wall, side * panelX, H / 2, z, dyn);
  } else {
    const grateBars = [];                               // each entry: [x, y, z, width, height, depth]
    for (const side of [-1, 1]) for (const z of dividerZ) {
      for (let x = panelStart + GRATE.spacing; x < DIV.xFar; x += GRATE.spacing) grateBars.push([side * x, H / 2, z, GRATE.bar, H, GRATE.bar]); // uprights
      for (const y of [0.1, H / 2, H - 0.1]) grateBars.push([side * panelX, y, z, panelLen, GRATE.rail, GRATE.rail]);                          // rails
    }
    const grateMesh = new THREE.InstancedMesh(barGeo, grateMat, grateBars.length); // all bars drawn in one go (fast in a headset)
    const dummy = new THREE.Object3D();
    grateBars.forEach(([x, y, z, w, h, d], i) => {
      dummy.position.set(x, y, z); dummy.scale.set(w, h, d); dummy.updateMatrix();
      grateMesh.setMatrixAt(i, dummy.matrix);
    });
    dyn.add(grateMesh);
  }
  if (cond.concealment === 'high') {
    box(1.9, 1.4, 1.1, M.dumpster, 9.4, 0.7, -9, dyn);
    box(1.9, 1.4, 1.1, M.dumpster, 9.4, 0.7, -21, dyn); 
    // can copy these to make more dumpsters if you want to fill the space more
    box(2.5, H, 0.25, M.wall, -9.2, H / 2, -11.5, dyn);   // alcove walls around the stairwell door
    box(2.5, H, 0.25, M.wall, -9.2, H / 2, -16.5, dyn);
  }
  }   // end of the per-level loop
  target = scene;
}

// ================= Controls, trial, log =================
const events = [];
const logEvent = (name, detail = '') => events.push([new Date().toISOString(), performance.now().toFixed(1), name, detail]);
const $ = id => document.getElementById(id);
const sel = { lighting: $('c-light'), entrapment: $('c-entrap'), concealment: $('c-conceal') };
const label = () => `lighting=${cond.lighting};entrapment=${cond.entrapment};concealment=${cond.concealment}`;
function setCond(next) {
  Object.assign(cond, next); seenTargets.clear();
  for (const k in sel) sel[k].value = cond[k];
  build(); logEvent('condition_set', label());
}
for (const k in sel) sel[k].addEventListener('change', () => setCond({ [k]: sel[k].value }));
$('preset-control').addEventListener('click', () => setCond({ lighting: 'high', entrapment: 'low', concealment: 'low' }));
$('preset-threat').addEventListener('click', () => setCond({ lighting: 'low', entrapment: 'high', concealment: 'high' }));

$('log').addEventListener('click', () => {
  const csv = 'iso_time,page_ms,event,detail\n' + events.map(e => e.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `garage-events-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});
renderer.xr.addEventListener('sessionstart', () => { camera.position.set(0, 0, 0); logEvent('vr_start'); });
renderer.xr.addEventListener('sessionend', () => { camera.position.set(0, CONFIG.eyeHeight, 0); logEvent('vr_end'); });

// ---- Start screen: the click starts the timing, gives the page keyboard focus and locks the mouse to the view ----
let started = false;
function begin() {
  if (!assetsReady || started) return;
  started = true; lastWalkTime = performance.now();
  $('start-screen').hidden = true; $('bar').hidden = false;
  logEvent('begin');
  window.focus(); lockPointer();
}
$('begin').addEventListener('click', begin);

// ---- Looking around with pointer lock: the mouse turns the view without dragging; Esc frees the mouse ----
// If the browser or the Qualtrics frame refuses pointer lock, dragging with the mouse button held turns the view instead.
let yaw = 0, pitch = 0, dragLogged = false;
function lockPointer() {
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && p.catch) p.catch(e => logEvent('pointer_lock_failed', e.name));
  } catch (e) { logEvent('pointer_lock_failed', e.name); }
}
renderer.domElement.addEventListener('click', () => { if (started && document.pointerLockElement !== renderer.domElement) lockPointer(); });
document.addEventListener('pointerlockchange', () => logEvent(document.pointerLockElement === renderer.domElement ? 'pointer_locked' : 'pointer_released'));
document.addEventListener('mousemove', e => {
  const locked = document.pointerLockElement === renderer.domElement, dragging = started && (e.buttons & 1) && e.target === renderer.domElement;
  if (!locked && !dragging) return;
  if (!locked && !dragLogged) { dragLogged = true; logEvent('look_by_drag'); }   // logged once: this participant looked by dragging
  const perPixel = CONFIG.look.degreesPerPixel * Math.PI / 180, limit = CONFIG.look.maxPitch * Math.PI / 180;
  yaw -= e.movementX * perPixel;
  pitch = Math.max(-limit, Math.min(limit, pitch - e.movementY * perPixel));
  camera.rotation.set(pitch, yaw, 0);
});

// ---- Leaving the window or tab (logged, so the analysis can see how often and how long) ----
window.addEventListener('blur', () => logEvent('focus_lost'));
window.addEventListener('focus', () => logEvent('focus_back'));
document.addEventListener('visibilitychange', () => logEvent(document.hidden ? 'page_hidden' : 'page_visible'));
// ---- Where you can walk ----
// The walkable floor is five connected areas. Each is a rectangle (x and z ranges) and lists the areas it joins onto.
// The two aisles sit one above the other, so the page keeps track of which area you are in.
const walkHalf = CONFIG.walk.halfWidth, walkGap = CONFIG.walk.endGap, laneRight = LANE.x1 - 0.45;
const ZONES = {
  upperAisle: { level: 0, x: [-walkHalf, walkHalf], z: [LANE.zFar + 0.5, zFront - walkGap], next: ['upperCross'] },   // ends level with the cross-aisle, so at the end the only way on is the turn
  upperCross: { level: 0, x: [walkHalf, laneRight], z: [LANE.zFar + 0.5, LANE.zTop - 0.5], next: ['upperAisle', 'ramp'] },
  ramp:       {           x: [LANE.x0 + 0.45, laneRight], z: [LANE.zTop - 0.5, LANE.zBottom + 0.5], next: ['upperCross', 'lowerCross'] },
  lowerCross: { level: 1, x: [walkHalf, laneRight], z: [LANE.zBottom + 0.5, LANE.zNear - 0.5], next: ['ramp', 'lowerAisle'] },
  lowerAisle: { level: 1, x: [-walkHalf, walkHalf], z: [zBack + walkGap, zFront - walkGap], next: ['lowerCross'] },
};
let zoneName = 'upperAisle';
const insideZone = (zone, x, z) => x >= zone.x[0] && x <= zone.x[1] && z >= zone.z[0] && z <= zone.z[1];
function refreshLevels() {
  const zone = ZONES[zoneName], p = player.position;
  p.y = zone.level === undefined ? rampY(p.z) : LEVELS[zone.level].y;                           // stand on the floor of the area you are in
  const lit = zone.level ?? (p.z < (LANE.zTop + LANE.zBottom) / 2 ? 0 : 1);                     // on the ramp: the nearer level
  lamps.forEach(l => { l.position.y = LEVELS[lit].y + H - 0.2; });
  LEVELS[0].group.visible = zoneName !== 'lowerAisle';       // a level you cannot see from where you are is not drawn (faster)
  LEVELS[1].group.visible = zoneName !== 'upperAisle';
}
function moveBy(dx, dz) {
  const p = player.position;
  for (const [x, z] of [[p.x + dx, p.z + dz], [p.x + dx, p.z], [p.x, p.z + dz]]) {              // the whole step, or else slide along the wall
    const name = [zoneName, ...ZONES[zoneName].next].find(n => insideZone(ZONES[n], x, z));
    if (!name) continue;
    p.x = x; p.z = z;
    if (name !== zoneName) { zoneName = name; logEvent('entered_area', name); }
    break;
  }
  refreshLevels();
}
refreshLevels();

// ---- Walking with W A S D or the arrow keys (desktop and emulator) ----
// Moves the viewer in the direction they are looking.
const keysDown = new Set(), walkAhead = new THREE.Vector3(), walkRight = new THREE.Vector3();
let lastWalkTime = performance.now();
const typingInPanel = () => ['SELECT', 'INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
window.addEventListener('keydown', e => {
  if (typingInPanel()) return;
  if (e.code.startsWith('Arrow')) e.preventDefault();
  keysDown.add(e.code);
});
window.addEventListener('keyup', e => keysDown.delete(e.code));
window.addEventListener('blur', () => keysDown.clear());   // no stuck keys after switching windows
function walk() {
  const now = performance.now(), dt = Math.min((now - lastWalkTime) / 1000, 0.1); lastWalkTime = now;
  if (!started) return;
  const held = (a, b) => (keysDown.has(a) || keysDown.has(b) ? 1 : 0);
  const ahead = held('KeyW', 'ArrowUp') - held('KeyS', 'ArrowDown'), right = held('KeyD', 'ArrowRight') - held('KeyA', 'ArrowLeft');
  if (!ahead && !right) return;
  camera.getWorldDirection(walkAhead); walkAhead.y = 0;      // where the viewer is facing, flattened to the floor
  if (walkAhead.lengthSq() < 1e-6) return;                   // looking straight up or down
  walkAhead.normalize(); walkRight.set(-walkAhead.z, 0, walkAhead.x);
  const step = walkAhead.multiplyScalar(ahead).addScaledVector(walkRight, right).normalize().multiplyScalar(CONFIG.walk.speed * dt);
  moveBy(step.x, step.z);
}

// ---- Which targets are in view: a tiny picture in which everything is black except the targets, each in its own colour ----
// Anything in front of a target hides it, as on screen. A target counts as seen once it covers TARGET_SEEN_PIXELS of this
// 160 x 90 picture (3 pixels is about 100 on a 960 x 540 screen; a target then is roughly 11 m away or closer).
const TARGET_SEEN_PIXELS = 3, TARGET_CHECK_SECONDS = 0.25;
const seenTargets = new Set();
let lastTargetCheck = 0;
const ID_W = 160, ID_H = 90, idTarget = new THREE.WebGLRenderTarget(ID_W, ID_H), idPixels = new Uint8Array(ID_W * ID_H * 4);
const ID_COLOURS = [[255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0], [0, 255, 255], [255, 0, 255]];
const idScene = new THREE.Scene(), idBlack = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false }), BLACK = new THREE.Color(0, 0, 0);
const idMeshes = TARGETS.map((t, i) => {
  const m = new THREE.Mesh(targetGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(...ID_COLOURS[i].map(v => v / 255)), fog: false }));
  m.matrixAutoUpdate = false; idScene.add(m); return m;
});
const isShown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
function targetsInView(cam = camera) {                       // pixels of each target in view, after anything in front of it
  const bg = scene.background, autoClear = renderer.autoClear;
  scene.overrideMaterial = idBlack; scene.background = BLACK;
  renderer.setRenderTarget(idTarget); renderer.clear(); renderer.render(scene, cam);   // everything black, for the depth
  idMeshes.forEach((m, i) => { m.visible = isShown(TARGETS[i]); m.matrix.copy(TARGETS[i].matrixWorld); });
  renderer.autoClear = false; renderer.render(idScene, cam);   // then the targets in colour, wherever nothing is in front of them
  renderer.autoClear = autoClear; renderer.setRenderTarget(null); scene.overrideMaterial = null; scene.background = bg;
  renderer.readRenderTargetPixels(idTarget, 0, 0, ID_W, ID_H, idPixels);
  const counts = ID_COLOURS.map(() => 0);
  for (let k = 0; k < idPixels.length; k += 4) {
    const i = ID_COLOURS.findIndex(c => c[0] === idPixels[k] && c[1] === idPixels[k + 1] && c[2] === idPixels[k + 2]);
    if (i >= 0) counts[i]++;
  }
  return counts;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
    walk();
  if (started && t - lastTargetCheck > TARGET_CHECK_SECONDS && !renderer.xr.isPresenting) {    // log each target the first time it is in view
    lastTargetCheck = t;
    targetsInView().forEach((pixels, i) => { if (pixels >= TARGET_SEEN_PIXELS && !seenTargets.has(i)) { seenTargets.add(i); logEvent('target_seen', TARGETS[i].name); } });
  }
  if (flickerLamp) {
    const on = Math.sin(t * 19) + Math.sin(t * 5.7) > -0.4 || Math.random() > 0.92;
    flickerLamp.intensity = on ? CONFIG.lighting.low.lampIntensity : 0.5;
  }
  renderer.render(scene, camera);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
// ---- Researcher tool: screenshots from fixed viewpoints, to compare brightness with the Unity version ----
// In the browser console: await garageCapture({ condition: 'threat' }). Each viewpoint: [area, x, z, look x, look z].
// The same viewpoints are in Unity under Garage > Capture Viewpoints.
const VIEWPOINTS = {
  upperStart: ['upperAisle', 0.8, 0, 0, -1], upperCross: ['upperCross', 7, -45.5, 1, 0], midRamp: ['ramp', 14.15, -22.1, 0, 1],
  lowerStart: ['lowerAisle', 2, 1.3, 0, -1], viewOut: ['upperAisle', 0.8, 0, -1, 0],
};
// How visible each exit sign is in the picture just rendered (pixels d): each sign is drawn once more in its own flat colour,
// which gives its on-screen size after anything in front of it, and its brightness is read from the real picture.
const SRGB_TO_LINEAR = Array.from({ length: 256 }, (_, v) => { const c = v / 255; return c < 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
const SIGN_IDS = [[255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0], [0, 255, 255], [255, 0, 255], [255, 128, 0], [128, 0, 255], [0, 128, 255]];
function measureSigns(d, width, height) {
  const signs = [...LEVELS.flatMap(l => l.exitSigns.map((mesh, k) => ({ mesh, name: l.name + (k === 0 ? ' stairwell' : ' exit ramp') }))),
                 ...TARGETS.map(mesh => ({ mesh, name: mesh.name }))];
  const saved = signs.map(s => s.mesh.material), bg = scene.background;
  signs.forEach((s, i) => { s.mesh.material = new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...SIGN_IDS[i].map(v => v / 255), THREE.SRGBColorSpace), fog: false }); });
  scene.background = new THREE.Color(0, 0, 0);
  renderer.render(scene, camera);
  const c = canvasOf(width, height), g = c.getContext('2d'); g.drawImage(renderer.domElement, 0, 0, width, height);
  const ids = g.getImageData(0, 0, width, height).data;
  signs.forEach((s, i) => { s.mesh.material.dispose(); s.mesh.material = saved[i]; }); scene.background = bg;
  const lumAt = k => 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2];
  const linAt = k => 0.2126 * SRGB_TO_LINEAR[d[k]] + 0.7152 * SRGB_TO_LINEAR[d[k + 1]] + 0.0722 * SRGB_TO_LINEAR[d[k + 2]];   // light, not pixel value
  return signs.map((s, i) => {
    const [r, gg, b] = SIGN_IDS[i]; let n = 0, lum = 0, lin = 0, x0 = width, y0 = height, x1 = -1, y1 = -1;
    const mine = k => Math.abs(ids[k] - r) < 3 && Math.abs(ids[k + 1] - gg) < 3 && Math.abs(ids[k + 2] - b) < 3;
    for (let k = 0; k < ids.length; k += 4) if (mine(k)) {
      n++; lum += lumAt(k); lin += linAt(k); const x = (k / 4) % width, y = Math.floor(k / 4 / width);
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    let around = 0, aroundLin = 0, m = 0;                                        // the surroundings: a box twice the object's size, minus the object
    if (n) {
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      for (let y = Math.max(0, y0 - h); y <= Math.min(height - 1, y1 + h); y++) for (let x = Math.max(0, x0 - w); x <= Math.min(width - 1, x1 + w); x++) {
        const k = (y * width + x) * 4; if (!mine(k)) { around += lumAt(k); aroundLin += linAt(k); m++; }
      }
    }
    // ratio: how many times brighter the object is than its surroundings, in light (Weber contrast = ratio - 1)
    return { sign: s.name, pixels: n, brightness: n ? +(lum / n).toFixed(1) : null, surroundings: m ? +(around / m).toFixed(1) : null,
             ratio: n && m && aroundLin > 0 ? (lin / n) / (aroundLin / m) : null };
  });
}
const garageEvents = () => events.slice();                         // the event log so far (researcher check)
const garageTargetsAt = (zone, x, z, dx, dz) => {                   // pixels of each target seen from a spot (researcher check)
  const saved = { zone: zoneName, pos: player.position.clone(), rot: camera.quaternion.clone() };
  zoneName = zone; player.position.x = x; player.position.z = z; refreshLevels();
  camera.rotation.set(0, Math.atan2(-dx, -dz), 0, 'YXZ'); player.updateMatrixWorld(true); scene.updateMatrixWorld(true);
  const counts = targetsInView();
  zoneName = saved.zone; player.position.copy(saved.pos); camera.quaternion.copy(saved.rot); refreshLevels();
  return Object.fromEntries(TARGETS.map((t, i) => [t.name, counts[i]]));
};
const garageMove = (dx, dz, steps = 1) => {                         // take walking steps (three.js x and z per step) and report where you are
  for (let i = 0; i < steps; i++) moveBy(dx, dz);
  return { area: zoneName, x: +player.position.x.toFixed(2), y: +player.position.y.toFixed(2), z: +player.position.z.toFixed(2) };
};
const garageTargetImage = () => targetCanvas.toDataURL('image/png');   // the target picture, for the Unity version
const garageCapture = async ({ condition = 'control', views = Object.keys(VIEWPOINTS), extra = [], width = 960, height = 540, magenta = false, backgroundOnly = false, signStats = false, noGlow = false } = {}) => {
  for (let i = 0; i < 100 && CONFIG.outside.photo && !outsidePhoto; i++) await new Promise(r => setTimeout(r, 100));   // wait for the photo
  const saved = { cond: { ...cond }, zone: zoneName, pos: player.position.clone(), camPos: camera.position.clone(), camRot: camera.quaternion.clone(), ratio: renderer.getPixelRatio() };
  setCond(condition === 'threat' ? { lighting: 'low', entrapment: 'high', concealment: 'high' } : { lighting: 'high', entrapment: 'low', concealment: 'low' });
  if (magenta) scene.background = new THREE.Color(1, 0, 1);       // anything magenta in the picture is the outside showing through
  const glowOpacity = glowMat.opacity; if (noGlow) glowMat.opacity = 0;   // to measure what the ceiling glow adds
  const shots = [...views.map(v => [v, ...VIEWPOINTS[v], 0]), ...extra];
  const out = [];
  renderer.setPixelRatio(1); renderer.setSize(width, height, false); camera.aspect = width / height; camera.updateProjectionMatrix();
  for (const [name, zone, x, z, dx, dz, pitch = 0] of shots) {
    zoneName = zone; player.position.x = x; player.position.z = z; refreshLevels();
    camera.position.set(0, CONFIG.eyeHeight, 0); camera.rotation.set(pitch, Math.atan2(-dx, -dz), 0, 'YXZ');
    if (backgroundOnly) {                                         // only the outside photo, with nothing in front of it (to line it up with Unity)
      const sky = new THREE.Scene(); sky.background = scene.background; sky.backgroundIntensity = scene.backgroundIntensity; sky.backgroundRotation.copy(scene.backgroundRotation);
      player.updateMatrixWorld(true); renderer.render(sky, camera);   // the camera isn't in this scene, so update its position by hand
    } else renderer.render(scene, camera);
    const c = canvasOf(width, height), g = c.getContext('2d'); g.drawImage(renderer.domElement, 0, 0, width, height);
    const d = g.getImageData(0, 0, width, height).data; let sum = 0, outside = 0;
    for (let i = 0; i < d.length; i += 4) { sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; if (d[i] - d[i + 1] > 80 && d[i + 2] - d[i + 1] > 80) outside++; }
    const shot = { name, condition, meanBrightness: +(sum / (width * height)).toFixed(2), outsideShare: outside / (width * height) };
    if (signStats) shot.signs = measureSigns(d, width, height); else shot.image = c.toDataURL('image/png');
    out.push(shot);
  }
  glowMat.opacity = glowOpacity;
  setCond(saved.cond); zoneName = saved.zone; player.position.copy(saved.pos); refreshLevels();
  camera.position.copy(saved.camPos); camera.quaternion.copy(saved.camRot);
  renderer.setPixelRatio(saved.ratio); renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  return out;
};
// ================= Start: check the link, then show the start screen =================
const T = window.GARAGE_TEXT;
$('begin').textContent = T.begin; $('bar-task').textContent = T.task; $('bar-controls').textContent = T.controls; $('error-text').textContent = T.linkError;
const CONDITIONS = { '0': { lighting: 'high', entrapment: 'low', concealment: 'low' },      // 0 = control
                     '1': { lighting: 'low', entrapment: 'high', concealment: 'high' } };   // 1 = threat
logEvent('page_loaded', `c=${condCode ?? ''};pid=${pid};debug=${DEBUG ? 1 : 0}`);
if (DEBUG) {
  $('panel').hidden = false;
  Object.assign(window, { garageEvents, garageTargetsAt, garageTargetImage, garageCapture, garageMove });   // researcher tools in the browser console
}
// "Click to begin" works only once every picture has loaded, so control never starts with the outside photo missing.
// A picture that fails to load stops the page with the error screen (and is logged), rather than showing a different scene.
let assetsReady = false;
$('begin').disabled = true; $('begin').textContent = T.loading;
THREE.DefaultLoadingManager.onLoad = () => {
  assetsReady = true; logEvent('assets_loaded');
  $('begin').disabled = false; $('begin').textContent = T.begin;
};
THREE.DefaultLoadingManager.onError = url => {
  logEvent('error', 'could not load ' + url.replace(/,/g, ' '));
  $('start-screen').hidden = true; $('error-screen').hidden = false;
};
if (CONDITIONS[condCode]) {
  setCond(CONDITIONS[condCode]); logEvent('condition_shown', condCode);
  $('start-screen').hidden = false;
} else if (DEBUG && condCode === null) {
  setCond({}); $('start-screen').hidden = false;                       // researcher mode without a code: control, switch with the panel
} else {
  logEvent('error', 'condition code ' + (condCode === null ? 'missing' : 'not 0 or 1'));   // never fall back to a condition
  $('error-screen').hidden = false;
}
</script>
